<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d4a35" />
  <title>Giochi con gli amici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d4a35;
      --bg2: #082b20;
      --panel: rgba(0, 0, 0, 0.3);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f4f1e8;
      --muted: #b9cbbf;
      --yellow: #f9c80e;
      --red: #e2342b;
      --sky: #63b3ff;
      --grass: #5cc75c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 0%, #136247, var(--bg) 45%, var(--bg2));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    h1 { font-family: "Lilita One", sans-serif; font-weight: 400; font-size: clamp(34px, 7vw, 56px); margin: 0 0 6px; letter-spacing: 1px; }
    p.sub { margin: 0 0 32px; color: var(--muted); font-size: 18px; }
    .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 300px)); gap: 22px; width: 100%; justify-content: center; }
    .game {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 26px 20px 22px;
      border-radius: 22px;
      background: var(--panel);
      border: 2px solid var(--border);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .game:hover, .game:focus-visible { transform: translateY(-4px); border-color: var(--yellow); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35); outline: none; }
    .game .art { width: 140px; height: 110px; display: grid; place-items: center; }
    .game h2 { font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 32px; margin: 0; }
    .game span { color: var(--muted); text-align: center; }
    .game .tag { font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); color: var(--text); }
    .uno-logo {
      width: 130px; height: 86px; border-radius: 50%; background: var(--red); border: 5px solid #fff;
      display: grid; place-items: center; transform: rotate(-12deg); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
    }
    .uno-logo b { font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 46px; color: var(--yellow); -webkit-text-stroke: 3px #1b1b1b; paint-order: stroke fill; }
  </style>
</head>
<body>
  <h1>Giochi con gli amici</h1>
  <p class="sub">Scegli a cosa giocare</p>
  <main class="games">
    <a class="game" href="/uno/">
      <div class="art"><div class="uno-logo"><b>UNO</b></div></div>
      <h2>UNO</h2>
      <span>Classico, Flip, No Mercy e Casinò. Da 2 a 10 giocatori, anche con i computer.</span>
      <span class="tag">📱 Anche da telefono</span>
    </a>
    <a class="game" href="/golf/">
      <div class="art">
        <svg width="140" height="110" viewBox="0 0 140 110" aria-hidden="true">
          <ellipse cx="70" cy="88" rx="62" ry="18" fill="#5cc75c" />
          <ellipse cx="86" cy="86" rx="9" ry="3.5" fill="#1b1b1b" />
          <line x1="86" y1="86" x2="86" y2="18" stroke="#f4f1e8" stroke-width="3" />
          <path d="M86 18 L118 28 L86 38 Z" fill="#e2342b" />
          <circle cx="38" cy="78" r="8" fill="#fff" stroke="#c9c9c9" stroke-width="1.5" />
        </svg>
      </div>
      <h2>Golf</h2>
      <span>Minigolf 3D: tutti tirano insieme sulla stessa buca, vince chi fa meno colpi.</span>
      <span class="tag">💻 Solo da computer</span>
    </a>
  </main>
</body>
</html>
